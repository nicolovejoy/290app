<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course dashboard</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 70rem; padding: 1rem; }
  nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  nav button { margin-left: auto; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; vertical-align: top; }
  td.flag { background: #ffe3e0; }
  td.empty { color: #999; text-align: center; }
  form { display: grid; gap: .75rem; max-width: 26rem; }
  label { display: grid; gap: .25rem; }
  input, button { font: inherit; padding: .4rem; }
</style>
</head>
<body>
<nav id="nav" hidden>
  <a href="#/">Grid</a>
  <a href="#/flagged">Flagged</a>
  <button id="signout">Sign out</button>
</nav>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
